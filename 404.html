<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>احجز رحلتك</title>
    <script>
        // هذا الملف ضروري لعمل GitHub Pages مع تطبيقات SPA
        // عند دخول مستخدم عبر رابط فرعي، GitHub Pages يعيد توجيه إلى 404.html
        // هذا السكريبت يحفظ المسار المطلوب ويعيد التوجيه إلى الصفحة الرئيسية
        sessionStorage.redirect = window.location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
</head>
<body>
    <p>جاري التوجيه...</p>
</body>
</html>
